display_information:
  name: Agent Gateway
  description: One gateway per person; the agents behind it are registry entries.
features:
  bot_user:
    display_name: agent-gateway
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:history
      - groups:history
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
